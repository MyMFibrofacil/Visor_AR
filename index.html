<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor Realidad Aumentada</title><link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/catalogo.css"><script type="module" src="assets/js/catalogo.js"></script></head>
<body><main><header><img src="assets/img/logo.png" alt="Logo de la marca"><h1>Visor Realidad Aumentada</h1></header>
<p>Explorá nuestros productos en 3D y miralos en tu habitación.</p>
<div class="campo-filtro buscador"><label for="buscar-productos">Buscar productos</label>
<input id="buscar-productos" type="search" placeholder="Buscar por nombre…" autocomplete="off" aria-controls="catalogo" disabled></div>
<div class="contenido-catalogo">
<aside class="panel-categorias" aria-labelledby="titulo-categorias">
<details>
<summary id="titulo-categorias">Categorías de producto</summary>
<div class="contenido-filtros">
<div id="categorias-productos"></div>
<button id="limpiar-categorias" type="button" disabled>Limpiar filtros</button>
</div></details>
</aside>
<section class="resultados-catalogo" aria-label="Productos disponibles">
<p id="estado-catalogo" role="status">Cargando productos…</p>
<div id="catalogo"></div></section></div></main></body></html>
